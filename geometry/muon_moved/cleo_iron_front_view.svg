<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -150 320 300" width="960" height="900">
  <title>CLEO iron layer, front view (beam's eye), to scale, inches</title>
  <style>
    text{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace;fill:#1c252d}
    .lbl{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:700}
    .g{fill:#3a77b8} .m{fill:#5b6872}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1c252d"/></marker>
  </defs>
  <rect x="-160" y="-150" width="320" height="300" fill="#ffffff"/>
  <!-- left side: 62 outer, 37 inner -->
  <rect x="-114.5" y="-105" width="62" height="210" fill="#7d8c99" stroke="#1c252d" stroke-width=".8"/>
  <rect x="-52.5" y="-105" width="37" height="210" fill="#a3b0bb" stroke="#1c252d" stroke-width=".8"/>
  <!-- right side -->
  <rect x="52.5" y="-105" width="62" height="210" fill="#7d8c99" stroke="#1c252d" stroke-width=".8"/>
  <rect x="15.5" y="-105" width="37" height="210" fill="#a3b0bb" stroke="#1c252d" stroke-width=".8"/>
  <!-- fillers -->
  <rect x="-15.5" y="-105" width="31" height="70" fill="#f2c79d" stroke="#d27a2c" stroke-width="1.2"/>
  <rect x="-15.5" y="35" width="31" height="70" fill="#f2c79d" stroke="#d27a2c" stroke-width="1.2"/>
  <!-- opening -->
  <rect x="-15.5" y="-35" width="31" height="70" fill="#ffffff" stroke="#1c252d" stroke-width=".5" stroke-dasharray="2 2"/>
  <!-- scint / virtual plane edges -->
  <circle r="39.37" fill="none" stroke="#3a77b8" stroke-width=".9" stroke-dasharray="4 3"/>
  <circle r="112.2" fill="none" stroke="#3a77b8" stroke-width=".9" stroke-dasharray="4 3"/>
  <circle r="1.8" fill="#1c252d"/>
  <text x="0" y="9" font-size="5" text-anchor="middle">beam</text>
  <!-- labels -->
  <text class="lbl" x="-83.5" y="2" font-size="10" text-anchor="middle">62″</text>
  <text class="lbl" x="-34" y="2" font-size="10" text-anchor="middle">37″</text>
  <text class="lbl" x="83.5" y="2" font-size="10" text-anchor="middle">62″</text>
  <text class="lbl" x="34" y="2" font-size="10" text-anchor="middle">37″</text>
  <text class="lbl" x="0" y="-67" font-size="8" text-anchor="middle">filler</text>
  <text x="0" y="-59" font-size="5" text-anchor="middle">31×70</text>
  <text class="lbl" x="0" y="73" font-size="8" text-anchor="middle">filler</text>
  <text x="0" y="81" font-size="5" text-anchor="middle">31×70</text>
  <text class="g" x="27" y="-47" font-size="5">r = 100 cm</text>
  <text class="g" x="80" y="-90" font-size="5">r = 285 cm</text>
  <!-- overall width -->
  <line x1="-114.5" y1="-112" x2="-114.5" y2="-127" stroke="#5b6872" stroke-width=".4"/>
  <line x1="114.5" y1="-112" x2="114.5" y2="-127" stroke="#5b6872" stroke-width=".4"/>
  <line x1="-114.5" y1="-122" x2="114.5" y2="-122" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="0" y="-126" font-size="6" text-anchor="middle">229″ (581.7 cm)</text>
  <!-- side widths -->
  <line x1="-114.5" y1="-111" x2="-15.5" y2="-111" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="-65" y="-114" font-size="5.5" text-anchor="middle">99″ (251.5)</text>
  <line x1="15.5" y1="-111" x2="114.5" y2="-111" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="65" y="-114" font-size="5.5" text-anchor="middle">99″ (251.5)</text>
  <!-- gap width -->
  <line x1="-15.5" y1="108" x2="-15.5" y2="120" stroke="#5b6872" stroke-width=".4"/>
  <line x1="15.5" y1="108" x2="15.5" y2="120" stroke="#5b6872" stroke-width=".4"/>
  <line x1="-15.5" y1="116" x2="15.5" y2="116" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="0" y="126" font-size="5.5" text-anchor="middle">31″ (78.7)</text>
  <!-- height -->
  <line x1="-122" y1="-105" x2="-122" y2="105" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="-126" y="0" font-size="6" text-anchor="middle" transform="rotate(-90 -126 0)">210″ (533.4 cm)</text>
  <!-- filler / opening / filler -->
  <line x1="122" y1="-105" x2="122" y2="-35" stroke="#d27a2c" stroke-width=".6" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="122" y1="-35" x2="122" y2="35" stroke="#1c252d" stroke-width=".5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="122" y1="35" x2="122" y2="105" stroke="#d27a2c" stroke-width=".6" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="16" y1="-35" x2="125" y2="-35" stroke="#5b6872" stroke-width=".3" stroke-dasharray="1.5 1.5"/>
  <line x1="16" y1="35" x2="125" y2="35" stroke="#5b6872" stroke-width=".3" stroke-dasharray="1.5 1.5"/>
  <text x="127" y="-68" font-size="5">70″ filler</text>
  <text x="127" y="-2" font-size="5">70″ open</text>
  <text class="m" x="127" y="5" font-size="4.5">(177.8 cm)</text>
  <text x="127" y="72" font-size="5">70″ filler</text>
  <text class="m" x="-150" y="142" font-size="5">x →  (y up) · layer thickness 14″ (35.6 cm) along the beam</text>
</svg>
